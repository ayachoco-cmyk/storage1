<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>GODZILLA 3D - Kaiju Destruction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #02040a;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body class="text-white">

    <!-- HUD: スコア表示 -->
    <div class="absolute top-4 left-4 z-20 flex items-center space-x-3 pointer-events-none">
        <div class="bg-slate-900/90 backdrop-blur-md px-4 py-2.5 rounded-xl border border-red-500/40 shadow-2xl flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full bg-red-500 animate-ping"></div>
            <div>
                <p class="text-[10px] text-slate-400 tracking-wider font-bold">KAIJU DESTRUCTION</p>
                <p class="text-xs font-mono font-bold text-white">
                    SCORE: <span id="scoreVal" class="text-amber-400 text-sm">0</span>
                    <span class="text-slate-500 text-[11px] font-normal"> / 100</span>
                </p>
            </div>
        </div>
    </div>

    <!-- 右上ツールボタン -->
    <div class="absolute top-4 right-4 z-20 flex items-center space-x-2">
        <button id="btnReset" class="w-9 h-9 bg-slate-900/90 hover:bg-red-950/90 backdrop-blur-md text-slate-300 hover:text-red-400 rounded-xl border border-slate-700 flex items-center justify-center text-sm shadow transition cursor-pointer" title="リセット">
            <i class="fa-solid fa-rotate-right"></i>
        </button>
        <button id="btnGuideToggle" class="w-9 h-9 bg-slate-900/90 hover:bg-slate-800 backdrop-blur-md border border-slate-700 rounded-xl flex items-center justify-center text-slate-300 text-sm shadow transition cursor-pointer" title="操作方法">
            <i class="fa-solid fa-question"></i>
        </button>
    </div>

    <!-- 操作ガイドモーダル -->
    <div id="guideModal" class="absolute top-16 right-4 z-30 hidden bg-slate-900/95 backdrop-blur-md p-4 rounded-2xl border border-slate-700 text-xs text-slate-300 space-y-2 shadow-2xl w-64">
        <div class="flex justify-between items-center font-bold text-cyan-400">
            <span><i class="fa-solid fa-gamepad"></i> 操作ガイド</span>
            <button id="btnCloseGuide" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <p>• 前進/後退: <span class="bg-slate-800 px-1 py-0.5 rounded text-white font-mono">W/S または 上下キー</span></p>
        <p>• 左右旋回: <span class="bg-slate-800 px-1 py-0.5 rounded text-white font-mono">A/D または 左右キー</span></p>
        <p>• 放射熱線: <span class="bg-slate-800 px-1 py-0.5 rounded text-white font-mono">SPACE</span> または 右側ボタン</p>
        <p class="text-amber-400 font-bold mt-2">★ 100棟破壊でステージクリア！</p>
    </div>

    <!-- 十字キー（操作UI） -->
    <div id="touchDpad" class="absolute bottom-6 left-6 z-20 grid grid-cols-3 gap-1.5 w-36 h-36 pointer-events-auto bg-slate-900/70 backdrop-blur-md p-2 rounded-2xl border border-slate-700/80 shadow-2xl transition-opacity duration-500">
        <div></div>
        <button id="btnUp" class="bg-slate-800 hover:bg-slate-700 active:bg-cyan-600 rounded-xl flex items-center justify-center text-white text-base shadow border border-slate-700 transition" title="前進"><i class="fa-solid fa-chevron-up"></i></button>
        <div></div>
        <button id="btnLeft" class="bg-slate-800 hover:bg-slate-700 active:bg-cyan-600 rounded-xl flex items-center justify-center text-white text-base shadow border border-slate-700 transition" title="左旋回"><i class="fa-solid fa-rotate-left"></i></button>
        <div class="flex items-center justify-center bg-slate-900/40 rounded-xl text-slate-500 text-xs"><i class="fa-solid fa-gamepad"></i></div>
        <button id="btnRight" class="bg-slate-800 hover:bg-slate-700 active:bg-cyan-600 rounded-xl flex items-center justify-center text-white text-base shadow border border-slate-700 transition" title="右旋回"><i class="fa-solid fa-rotate-right"></i></button>
        <div></div>
        <button id="btnDown" class="bg-slate-800 hover:bg-slate-700 active:bg-cyan-600 rounded-xl flex items-center justify-center text-white text-base shadow border border-slate-700 transition" title="後退"><i class="fa-solid fa-chevron-down"></i></button>
        <div></div>
    </div>

    <!-- アクションボタン（咆哮 / 熱線） -->
    <div id="touchActions" class="absolute bottom-4 right-4 z-20 flex flex-col items-end space-y-3 pointer-events-auto transition-opacity duration-500">
        <button id="btnRoar" class="w-16 h-16 bg-gradient-to-tr from-amber-600 via-orange-500 to-red-600 hover:from-amber-500 hover:to-red-500 active:scale-95 rounded-full flex flex-col items-center justify-center text-white shadow-xl border-2 border-amber-300/80 transition group cursor-pointer" title="咆哮">
            <i class="fa-solid fa-bullhorn text-lg group-hover:scale-110 transition animate-bounce"></i>
            <span class="font-black text-[9px] tracking-widest mt-0.5">ROAR</span>
        </button>

        <button id="btnBeam" class="w-28 h-28 bg-gradient-to-tr from-cyan-700 via-sky-400 to-fuchsia-600 hover:from-cyan-600 hover:to-fuchsia-500 active:scale-95 rounded-full flex flex-col items-center justify-center text-white shadow-2xl border-4 border-cyan-300/80 transition group cursor-pointer">
            <i class="fa-solid fa-bolt text-2xl mb-0.5 group-hover:scale-110 transition animate-pulse text-cyan-100"></i>
            <span class="font-black text-xs tracking-wider drop-shadow">ATOMIC</span>
            <span class="font-bold text-[9px] text-cyan-100 tracking-widest">BEAM</span>
        </button>
    </div>

    <!-- クリア演出UIオーバーレイ -->
    <div id="clearOverlay" class="absolute inset-0 z-30 pointer-events-none hidden flex flex-col items-center justify-between p-8 bg-gradient-to-t from-slate-950/80 via-transparent to-slate-950/40">
        <div class="mt-8 text-center animate-bounce">
            <span class="px-4 py-1.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/50 text-xs font-bold tracking-widest uppercase">Target Destroyed</span>
            <h1 class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-400 to-red-500 drop-shadow-[0_5px_15px_rgba(251,191,36,0.6)] mt-2">
                MISSION COMPLETE!
            </h1>
            <p class="text-sm font-semibold text-cyan-300 tracking-widest mt-1">100棟 壊滅達成！ 完全制覇</p>
        </div>

        <div class="pointer-events-auto mb-6 flex flex-col items-center space-y-3">
            <button id="btnClearRestart" class="px-8 py-3.5 bg-gradient-to-r from-amber-500 to-red-600 hover:from-amber-400 hover:to-red-500 text-white font-bold rounded-2xl shadow-[0_0_30px_rgba(245,158,11,0.5)] border border-amber-200 transition transform hover:scale-105 active:scale-95 flex items-center space-x-2">
                <i class="fa-solid fa-rotate-right"></i>
                <span>もう一度プレイする</span>
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Google Drive 直リンクURL
        const SIGN_IMG_URL = "https://lh3.googleusercontent.com/d/1Tbjv5G1PzgHRE_6mxVNcvNt6tnH_hR-N";
        const CLEAR_IMG_URL = "https://lh3.googleusercontent.com/d/1DECktFs6uWSGYljHw4YI1Z5PfSl-JRaK";

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playRoarSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const duration = 3.5; 
            
            const subOsc = audioCtx.createOscillator();
            const mainOsc = audioCtx.createOscillator();
            const noise = audioCtx.createBufferSource();
            
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1);
            }
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(300, now);
            filter.frequency.linearRampToValueAtTime(750, now + 0.4); 
            filter.frequency.exponentialRampToValueAtTime(150, now + duration);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(3.0, now + 0.2);
            gain.gain.setValueAtTime(3.0, now + 2.0);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            mainOsc.type = 'sawtooth';
            mainOsc.frequency.setValueAtTime(110, now);
            mainOsc.frequency.linearRampToValueAtTime(220, now + 0.4);
            mainOsc.frequency.exponentialRampToValueAtTime(60, now + duration);

            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(60, now);
            subOsc.frequency.linearRampToValueAtTime(120, now + 0.4);
            subOsc.frequency.exponentialRampToValueAtTime(35, now + duration);

            const subGain = audioCtx.createGain();
            subGain.gain.setValueAtTime(2.0, now);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            mainOsc.connect(filter);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            subOsc.connect(subGain);
            subGain.connect(audioCtx.destination);

            mainOsc.start(now);
            subOsc.start(now);
            noise.start(now);

            mainOsc.stop(now + duration);
            subOsc.stop(now + duration);
            noise.stop(now + duration);
        }

        function playBeamSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const duration = 2.5;

            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1);
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(150, now);
            noiseFilter.frequency.linearRampToValueAtTime(800, now + 0.4);
            noiseFilter.frequency.exponentialRampToValueAtTime(200, now + duration);

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.01, now);
            noiseGain.gain.linearRampToValueAtTime(3.5, now + 0.3);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);

            const subOsc = audioCtx.createOscillator();
            subOsc.type = 'sawtooth';
            subOsc.frequency.setValueAtTime(50, now);
            subOsc.frequency.exponentialRampToValueAtTime(140, now + 0.4);
            subOsc.frequency.exponentialRampToValueAtTime(35, now + duration);

            const subFilter = audioCtx.createBiquadFilter();
            subFilter.type = 'lowpass';
            subFilter.frequency.setValueAtTime(300, now);

            const subGain = audioCtx.createGain();
            subGain.gain.setValueAtTime(3.0, now);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            subOsc.connect(subFilter);
            subFilter.connect(subGain);
            subGain.connect(audioCtx.destination);

            const zapOsc = audioCtx.createOscillator();
            zapOsc.type = 'sawtooth';
            zapOsc.frequency.setValueAtTime(120, now);
            zapOsc.frequency.linearRampToValueAtTime(240, now + 0.5);
            zapOsc.frequency.exponentialRampToValueAtTime(80, now + duration);

            const lfo = audioCtx.createOscillator();
            lfo.type = 'sawtooth';
            lfo.frequency.setValueAtTime(32, now);

            const lfoGain = audioCtx.createGain();
            lfoGain.gain.setValueAtTime(180, now);

            lfo.connect(lfoGain);
            lfoGain.connect(zapOsc.frequency);

            const zapFilter = audioCtx.createBiquadFilter();
            zapFilter.type = 'bandpass';
            zapFilter.frequency.setValueAtTime(1800, now);
            zapFilter.Q.setValueAtTime(4.0, now);

            const zapGain = audioCtx.createGain();
            zapGain.gain.setValueAtTime(0.01, now);
            zapGain.gain.linearRampToValueAtTime(1.8, now + 0.3);
            zapGain.gain.setValueAtTime(1.8, now + 1.8);
            zapGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            zapOsc.connect(zapFilter);
            zapFilter.connect(zapGain);
            zapGain.connect(audioCtx.destination);

            noise.start(now);
            subOsc.start(now);
            zapOsc.start(now);
            lfo.start(now);

            noise.stop(now + duration);
            subOsc.stop(now + duration);
            zapOsc.stop(now + duration);
            lfo.stop(now + duration);
        }

        function playCollapseSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const duration = 1.8;

            const subOsc = audioCtx.createOscillator();
            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(100, now);
            subOsc.frequency.exponentialRampToValueAtTime(25, now + duration);

            const subGain = audioCtx.createGain();
            subGain.gain.setValueAtTime(2.5, now);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            subOsc.connect(subGain);
            subGain.connect(audioCtx.destination);

            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1);
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(400, now);
            filter.frequency.exponentialRampToValueAtTime(80, now + duration);

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(1.8, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);

            subOsc.start(now);
            noise.start(now);

            subOsc.stop(now + duration);
            noise.stop(now + duration);
        }

        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                powerPreference: 'high-performance',
                alpha: false,
                failIfMajorPerformanceCaveat: false
            });
        } catch (e) {
            console.warn("WebGL renderer creation caught exception:", e);
        }

        if (!renderer) {
            const errDiv = document.createElement('div');
            errDiv.className = 'absolute inset-0 bg-slate-950 flex flex-col items-center justify-center text-center p-6 z-50 text-white';
            errDiv.innerHTML = '<h2 class="text-2xl font-bold text-red-500 mb-2">WebGL Error</h2><p class="text-sm text-slate-300">WebGLコンテキストを初期化できませんでした。</p>';
            document.body.appendChild(errDiv);
        } else {
            function getViewportSize() {
                if (window.visualViewport) {
                    return { width: window.visualViewport.width, height: window.visualViewport.height };
                }
                return { width: window.innerWidth, height: window.innerHeight };
            }

            const initialSize = getViewportSize();
            renderer.setSize(initialSize.width, initialSize.height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x02040a);
            scene.fog = new THREE.FogExp2(0x02040a, 0.005);

            const camera = new THREE.PerspectiveCamera(45, initialSize.width / initialSize.height, 0.1, 1000);

            const ambientLight = new THREE.AmbientLight(0x283856, 1.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x7dd3fc, 2.2);
            dirLight.position.set(60, 140, 60);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            const explosionLight = new THREE.PointLight(0xffaa33, 0, 180);
            explosionLight.position.set(0, 20, 0);
            scene.add(explosionLight);

            // --- テクスチャの事前ロード ---
            const textureLoader = new THREE.TextureLoader();
            textureLoader.setCrossOrigin('anonymous');

            const signBoardTexture = textureLoader.load(SIGN_IMG_URL, undefined, undefined, (err) => {
                console.warn("Signboard image load fallback", err);
            });
            const clearBoardTexture = textureLoader.load(CLEAR_IMG_URL, undefined, undefined, (err) => {
                console.warn("Clear image load fallback", err);
            });

            function createBuildingTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#0a0e1a';
                ctx.fillRect(0, 0, 128, 128);

                const colors = ['#fffb00', '#ffea00', '#ffcc00', '#fde047', '#ffffff'];
                for (let x = 12; x < 116; x += 18) {
                    for (let y = 12; y < 116; y += 22) {
                        ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                        if (Math.random() > 0.18) {
                            ctx.fillRect(x, y, 10, 14);
                        }
                    }
                }

                const texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                return texture;
            }

            const buildingTexture = createBuildingTexture();
            const particles = [];
            const stuckSigns = [];

            // 支柱なし・1.5倍サイズ（13.5 x 9）の板ポリゴンを残骸に突き立てる
            function spawnStuckSign(x, z) {
                const boardGeo = new THREE.PlaneGeometry(13.5, 9);
                const boardMat = new THREE.MeshStandardMaterial({
                    map: signBoardTexture,
                    side: THREE.DoubleSide,
                    roughness: 0.4,
                    metalness: 0.1
                });
                const boardMesh = new THREE.Mesh(boardGeo, boardMat);

                // 板の下部が地面・残骸に突き刺さっているように高さを調整
                boardMesh.position.set(
                    x + (Math.random() - 0.5) * 5,
                    3.8,
                    z + (Math.random() - 0.5) * 5
                );
                // 突き刺さったようにランダムに傾きと方角を設定
                boardMesh.rotation.y = Math.random() * Math.PI * 2;
                boardMesh.rotation.x = (Math.random() - 0.5) * 0.45;
                boardMesh.rotation.z = (Math.random() - 0.5) * 0.45;

                boardMesh.castShadow = true;
                boardMesh.receiveShadow = true;

                scene.add(boardMesh);
                stuckSigns.push(boardMesh);
            }

            function createExplosion(x, y, z, isCollapse = false) {
                if (isCollapse) {
                    playCollapseSound();
                } else {
                    playBeamSound();
                }

                explosionLight.position.set(x, y + 8, z);
                explosionLight.intensity = 55.0;
                let flashFadeTimer = 15;
                const fadeFlash = () => {
                    flashFadeTimer--;
                    explosionLight.intensity *= 0.7;
                    if (flashFadeTimer > 0) requestAnimationFrame(fadeFlash);
                    else explosionLight.intensity = 0;
                };
                fadeFlash();

                const flashGeo = new THREE.SphereGeometry(14, 8, 8);
                const flashMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.95 });
                const flash = new THREE.Mesh(flashGeo, flashMat);
                flash.position.set(x, y + 10, z);
                scene.add(flash);
                particles.push({ mesh: flash, type: 'flash', life: 0.8 });

                for (let i = 0; i < 30; i++) {
                    const isDebris = Math.random() > 0.3;
                    if (isDebris) {
                        const size = 3 + Math.random() * 5;
                        const pGeo = new THREE.BoxGeometry(size, size, size);
                        const pMat = new THREE.MeshStandardMaterial({ 
                            color: 0x1e2530, 
                            roughness: 0.8, 
                            metalness: 0.3 
                        });
                        const pMesh = new THREE.Mesh(pGeo, pMat);
                        pMesh.position.set(x + (Math.random() - 0.5) * 16, Math.random() * 12, z + (Math.random() - 0.5) * 16);
                        
                        const vel = new THREE.Vector3(
                            (Math.random() - 0.5) * 14.0,
                            Math.random() * 16.0 + 4.0,
                            (Math.random() - 0.5) * 14.0
                        );
                        const rotVel = new THREE.Vector3((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5);
                        
                        scene.add(pMesh);
                        particles.push({ mesh: pMesh, velocity: vel, rotVelocity: rotVel, type: 'debris', life: 2.0, gravity: 0.45 });
                    } else {
                        const pGeo = new THREE.SphereGeometry(8 + Math.random() * 10, 6, 6);
                        const pMat = new THREE.MeshBasicMaterial({ 
                            color: 0x475569, 
                            transparent: true, 
                            opacity: 0.8 
                        });
                        const pMesh = new THREE.Mesh(pGeo, pMat);
                        pMesh.position.set(x + (Math.random() - 0.5) * 14, Math.random() * 10, z + (Math.random() - 0.5) * 14);
                        
                        const vel = new THREE.Vector3(
                            (Math.random() - 0.5) * 5.0,
                            Math.random() * 6.0 + 2.0,
                            (Math.random() - 0.5) * 5.0
                        );
                        
                        scene.add(pMesh);
                        particles.push({ mesh: pMesh, velocity: vel, type: 'smoke', life: 2.5, scaleGrowth: 0.05 });
                    }
                }
            }

            let destructionScore = 0;
            let isGameCleared = false;
            let clearPoseTimer = 0;
            let clearBackdropMesh = null;

            // ゲームクリア処理（ビームの完全停止と消去を追加）
            function triggerGameClear() {
                if (isGameCleared) return;
                isGameCleared = true;

                // ★ ビームを即座に消去し、照射状態を完全停止
                isBeamFiring = false;
                beamTimer = 0;
                beam.material.opacity = 0;
                monsterSpotlight.color.setHex(0x00c6ff);
                monsterSpotlight.intensity = 14;

                // キー入力をリセット
                Object.keys(keys).forEach(k => keys[k] = false);

                // UIの切り替え
                document.getElementById('touchDpad').classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('touchActions').classList.add('opacity-0', 'pointer-events-none');
                const overlay = document.getElementById('clearOverlay');
                if (overlay) overlay.classList.remove('hidden');

                // ゴジラの背後に巨大クリア記念ボードを出現
                const backdropGeo = new THREE.PlaneGeometry(36, 24);
                const backdropMat = new THREE.MeshStandardMaterial({
                    map: clearBoardTexture,
                    side: THREE.DoubleSide,
                    roughness: 0.3,
                    metalness: 0.1,
                    emissive: 0x333333,
                    emissiveMap: clearBoardTexture
                });
                clearBackdropMesh = new THREE.Mesh(backdropGeo, backdropMat);

                const backDist = 22;
                clearBackdropMesh.position.set(
                    godzillaPos.x - Math.sin(godzillaAngle) * backDist,
                    14,
                    godzillaPos.y - Math.cos(godzillaAngle) * backDist
                );
                clearBackdropMesh.rotation.y = godzillaAngle;
                scene.add(clearBackdropMesh);

                playRoarSound();
            }

            function collapseBuilding(b) {
                if (b.destroyed) return;
                b.destroyed = true;
                destructionScore++;
                const scoreEl = document.getElementById('scoreVal');
                if (scoreEl) scoreEl.innerText = destructionScore;

                createExplosion(b.x, b.height / 2, b.z, true);
                b.mesh.visible = false;

                // ランダム1/4（25%）の確率で拡大板ポリゴンを残骸に突き立てる
                if (Math.random() < 0.25) {
                    spawnStuckSign(b.x, b.z);
                }

                const segments = 3;
                const segHeight = b.height / segments;
                for (let s = 0; s < segments; s++) {
                    const segGeo = new THREE.BoxGeometry(b.width * 0.95, segHeight * 0.95, b.depth * 0.95);
                    const segMat = new THREE.MeshStandardMaterial({
                        map: buildingTexture,
                        roughness: 0.7,
                        metalness: 0.3
                    });
                    const segMesh = new THREE.Mesh(segGeo, segMat);
                    const startY = (s * segHeight) + (segHeight / 2);
                    segMesh.position.set(b.x + (Math.random() - 0.5) * 3, startY, b.z + (Math.random() - 0.5) * 3);
                    scene.add(segMesh);

                    const vel = new THREE.Vector3(
                        (Math.random() - 0.5) * 6.0,
                        Math.random() * 4.0 + (s * 0.8),
                        (Math.random() - 0.5) * 6.0
                    );
                    const rotVel = new THREE.Vector3((Math.random() - 0.5) * 0.25, (Math.random() - 0.5) * 0.25, (Math.random() - 0.5) * 0.25);

                    particles.push({
                        mesh: segMesh,
                        velocity: vel,
                        rotVelocity: rotVel,
                        type: 'segment',
                        life: 2.5,
                        gravity: 0.5
                    });
                }

                // 100棟破壊達成でクリア判定
                if (destructionScore >= 100 && !isGameCleared) {
                    triggerGameClear();
                }
            }

            const buildings = [];
            const citySize = 7;
            const blockSize = 32;

            function createCity() {
                for (let x = -citySize; x <= citySize; x++) {
                    for (let z = -citySize; z <= citySize; z++) {
                        if (Math.abs(x) <= 1 && Math.abs(z) <= 1) continue;
                        if (Math.random() > 0.85) continue;

                        const width = 10 + Math.random() * 10;
                        const depth = 10 + Math.random() * 10;
                        const height = 20 + Math.random() * 60;

                        const posX = x * blockSize;
                        const posZ = z * blockSize;

                        const buildingMat = new THREE.MeshStandardMaterial({
                            map: buildingTexture,
                            roughness: 0.2,
                            metalness: 0.3,
                            emissive: 0x443300,
                            emissiveMap: buildingTexture,
                            emissiveIntensity: 1.8
                        });

                        const geom = new THREE.BoxGeometry(width, height, depth);
                        
                        const repeatX = Math.max(1, Math.round(width / 6));
                        const repeatY = Math.max(1, Math.round(height / 10));
                        buildingTexture.repeat.set(repeatX, repeatY);

                        const mesh = new THREE.Mesh(geom, buildingMat);
                        mesh.position.set(posX, height / 2, posZ);
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;
                        scene.add(mesh);

                        buildings.push({
                            mesh: mesh,
                            x: posX,
                            z: posZ,
                            width: width,
                            depth: depth,
                            height: height,
                            destroyed: false
                        });
                    }
                }

                const groundGeo = new THREE.PlaneGeometry(800, 800);
                const groundMat = new THREE.MeshStandardMaterial({ color: 0x060913, roughness: 0.8 });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                scene.add(ground);
            }
            createCity();

            const godzillaGroup = new THREE.Group();

            const skinMaterial = new THREE.MeshStandardMaterial({
                color: 0x090d16,
                roughness: 0.5,
                metalness: 0.6
            });

            const spineMaterial = new THREE.MeshStandardMaterial({
                color: 0x00f2fe,
                emissive: 0x00c6ff,
                emissiveIntensity: 3.0,
                roughness: 0.1
            });

            const torsoGeo = new THREE.CylinderGeometry(3.8, 5.5, 14, 5);
            const torso = new THREE.Mesh(torsoGeo, skinMaterial);
            torso.position.y = 9;
            torso.castShadow = true;
            godzillaGroup.add(torso);

            const headGeo = new THREE.BoxGeometry(3.2, 3.2, 5.5);
            const head = new THREE.Mesh(headGeo, skinMaterial);
            head.position.set(0, 17, 2.5);
            head.castShadow = true;
            godzillaGroup.add(head);

            const eyeGeo = new THREE.BoxGeometry(0.6, 0.4, 0.2);
            const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
            
            const leftEye = new THREE.Mesh(eyeGeo, eyeMaterial);
            leftEye.position.set(1.1, 0.2, 2.85);
            head.add(leftEye);

            const rightEye = new THREE.Mesh(eyeGeo, eyeMaterial);
            rightEye.position.set(-1.1, 0.2, 2.85);
            head.add(rightEye);

            const armGeo = new THREE.BoxGeometry(1.2, 5, 1.5);
            const leftArm = new THREE.Mesh(armGeo, skinMaterial);
            leftArm.position.set(3, 11, 2);
            leftArm.rotation.x = -0.3;
            godzillaGroup.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, skinMaterial);
            rightArm.position.set(-3, 11, 2);
            rightArm.rotation.x = -0.3;
            godzillaGroup.add(rightArm);

            const spines = [];
            for (let i = 0; i < 7; i++) {
                const spineGeo = new THREE.ConeGeometry(1.5, 3.8 + i * 0.5, 4);
                const spine = new THREE.Mesh(spineGeo, spineMaterial);
                spine.position.set(0, 7 + i * 2.1, -3.2 - i * 0.5);
                spine.rotation.x = -0.15;
                godzillaGroup.add(spine);
                spines.push(spine);
            }

            const tailGeo = new THREE.ConeGeometry(3, 18, 5);
            const tail = new THREE.Mesh(tailGeo, skinMaterial);
            tail.position.set(0, 5, -7.5);
            tail.rotation.x = -Math.PI / 2.2;
            godzillaGroup.add(tail);

            const legGeo = new THREE.CylinderGeometry(2, 2.5, 10, 5);
            const leftLeg = new THREE.Mesh(legGeo, skinMaterial);
            leftLeg.position.set(2.6, 4, 0);
            leftLeg.castShadow = true;
            godzillaGroup.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, skinMaterial);
            rightLeg.position.set(-2.6, 4, 0);
            rightLeg.castShadow = true;
            godzillaGroup.add(rightLeg);

            const monsterSpotlight = new THREE.SpotLight(0x00c6ff, 14.0, 70, Math.PI / 3, 0.4, 1);
            monsterSpotlight.position.set(0, 2, 14);
            godzillaGroup.add(monsterSpotlight);

            godzillaGroup.position.set(0, 0, 0);
            scene.add(godzillaGroup);

            const beamGeo = new THREE.CylinderGeometry(1.5, 3.5, 200, 12);
            const beamMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe, transparent: true, opacity: 0 });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            beam.rotation.x = Math.PI / 2;
            beam.position.set(0, 16, 100);
            godzillaGroup.add(beam);

            const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, ' ': false };

            function triggerActionInteraction() {
                initAudio();
                if (isWaitingForFirstTap) {
                    isWaitingForFirstTap = false;
                    isIntroAnimating = true;
                    introProgress = 0;
                }
            }

            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
                triggerActionInteraction();
                if (keys.hasOwnProperty(e.key)) {
                    keys[e.key] = true;
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'w', 'a', 's', 'd'].includes(e.key)) {
                        e.preventDefault();
                    }
                }
                if (e.key === ' ' && !isGameCleared) triggerBeam();
            });
            window.addEventListener('keyup', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
                if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
            });

            let isBeamFiring = false;
            let beamTimer = 0;
            function triggerBeam() {
                if (isGameCleared) return;
                triggerActionInteraction();
                if (!isBeamFiring) {
                    isBeamFiring = true;
                    beamTimer = 60;
                    playBeamSound();
                    spines.forEach(s => s.material.emissive.setHex(0xf0abfc));
                    monsterSpotlight.color.setHex(0xf0abfc);
                    monsterSpotlight.intensity = 22;
                }
            }

            let godzillaPos = new THREE.Vector2(0, 0);
            let godzillaAngle = 0;
            let targetGodzillaAngle = 0;
            const moveSpeed = 0.48;
            let clock = new THREE.Clock();

            let isWaitingForFirstTap = true;
            let isIntroAnimating = false;
            let introProgress = 0;

            function startIntroCamera() {
                isWaitingForFirstTap = true;
                isIntroAnimating = false;
                introProgress = 0;
            }

            function resetGame() {
                godzillaGroup.position.set(0, 0, 0);
                godzillaGroup.rotation.y = 0;
                godzillaAngle = 0;
                targetGodzillaAngle = 0;
                godzillaPos.set(0, 0);
                destructionScore = 0;
                isGameCleared = false;
                clearPoseTimer = 0;

                // ビーム状態リセット
                isBeamFiring = false;
                beamTimer = 0;
                beam.material.opacity = 0;

                const scoreVal = document.getElementById('scoreVal');
                if (scoreVal) scoreVal.innerText = destructionScore;

                // UI復帰
                document.getElementById('touchDpad').classList.remove('opacity-0', 'pointer-events-none');
                document.getElementById('touchActions').classList.remove('opacity-0', 'pointer-events-none');
                const overlay = document.getElementById('clearOverlay');
                if (overlay) overlay.classList.add('hidden');

                // クリア看板の撤去
                if (clearBackdropMesh) {
                    scene.remove(clearBackdropMesh);
                    clearBackdropMesh = null;
                }

                // 突き刺さった板ポリゴンの全撤去
                stuckSigns.forEach(s => scene.remove(s));
                stuckSigns.length = 0;

                // ビルの復旧
                buildings.forEach(b => {
                    b.destroyed = false;
                    b.mesh.visible = true;
                    b.mesh.position.set(b.x, b.height / 2, b.z);
                    b.mesh.rotation.set(0, 0, 0);
                });

                // ポーズ初期化
                head.rotation.x = 0;
                leftArm.rotation.x = -0.3;
                leftArm.rotation.z = 0;
                rightArm.rotation.x = -0.3;
                rightArm.rotation.z = 0;
                spines.forEach(s => {
                    s.material.emissive.setHex(0x00c6ff);
                    s.material.emissiveIntensity = 3.0;
                });

                startIntroCamera();
                playRoarSound();
            }

            function animate() {
                requestAnimationFrame(animate);
                const time = clock.getElapsedTime();

                // クリア時のダイナミックポーズ演出
                if (isGameCleared) {
                    clearPoseTimer += 0.02;

                    // ビームは確実に消灯状態を維持
                    beam.material.opacity = 0;

                    // 勝利のポーズ（頭を空に向け、両腕を大きく突き上げる）
                    head.rotation.x = -0.45 + Math.sin(clearPoseTimer * 4) * 0.15;
                    leftArm.rotation.x = -1.6 + Math.sin(clearPoseTimer * 3) * 0.35;
                    leftArm.rotation.z = 0.5 + Math.cos(clearPoseTimer * 3) * 0.2;
                    rightArm.rotation.x = -1.6 - Math.sin(clearPoseTimer * 3) * 0.35;
                    rightArm.rotation.z = -0.5 - Math.cos(clearPoseTimer * 3) * 0.2;

                    torso.position.y = 9 + Math.abs(Math.sin(clearPoseTimer * 4)) * 0.8;
                    tail.rotation.z = Math.sin(clearPoseTimer * 2) * 0.4;

                    // 背びれがクリア特別演出（パルス発光）
                    const pulse = (Math.sin(clearPoseTimer * 8) + 1) * 0.5;
                    spines.forEach((s, idx) => {
                        const hue = (clearPoseTimer * 0.2 + idx * 0.1) % 1;
                        s.material.emissive.setHSL(hue, 1.0, 0.5);
                        s.material.emissiveIntensity = 2.0 + pulse * 4.0;
                    });

                    // カメラがゴジラと背後のクリア看板を捉え、ゆっくりと周囲を旋回
                    const camAngle = godzillaAngle + Math.sin(clearPoseTimer * 0.6) * 0.6;
                    const camDist = 24;
                    const camHeight = 12 + Math.sin(clearPoseTimer * 0.8) * 2;
                    camera.position.x = godzillaGroup.position.x + Math.sin(camAngle) * camDist;
                    camera.position.z = godzillaGroup.position.z + Math.cos(camAngle) * camDist;
                    camera.position.y = camHeight;
                    camera.lookAt(godzillaGroup.position.x, godzillaGroup.position.y + 14, godzillaGroup.position.z);

                    renderer.render(scene, camera);
                    return;
                }

                let forwardInput = 0;
                let turnInput = 0;

                if (!isWaitingForFirstTap && !isIntroAnimating) {
                    if (keys.w || keys.ArrowUp) forwardInput += 1;
                    if (keys.s || keys.ArrowDown) forwardInput -= 1;
                    if (keys.a || keys.ArrowLeft) turnInput += 1;
                    if (keys.d || keys.ArrowRight) turnInput -= 1;
                }

                if (turnInput !== 0) {
                    targetGodzillaAngle += turnInput * 0.045;
                }

                let angleDiff = targetGodzillaAngle - godzillaAngle;
                angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
                godzillaAngle += angleDiff * 0.15;

                if (forwardInput !== 0) {
                    godzillaPos.x += Math.sin(godzillaAngle) * moveSpeed * forwardInput;
                    godzillaPos.y += Math.cos(godzillaAngle) * moveSpeed * forwardInput;

                    const walkCycle = Math.sin(time * 12);
                    leftLeg.rotation.x = walkCycle * 0.45 * forwardInput;
                    rightLeg.rotation.x = -walkCycle * 0.45 * forwardInput;
                    torso.position.y = 9 + Math.abs(Math.sin(time * 12)) * 0.6;
                    tail.rotation.z = Math.sin(time * 7) * 0.25;
                } else {
                    leftLeg.rotation.x = 0;
                    rightLeg.rotation.x = 0;
                    torso.position.y = 9;
                    tail.rotation.z = 0;
                }

                godzillaPos.x = Math.max(-200, Math.min(200, godzillaPos.x));
                godzillaPos.y = Math.max(-200, Math.min(200, godzillaPos.y));

                godzillaGroup.position.x = godzillaPos.x;
                godzillaGroup.position.z = godzillaPos.y;
                godzillaGroup.rotation.y = godzillaAngle;

                // パーティクル更新ループ
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.life -= 0.02;
                    if (p.type === 'flash') {
                        p.mesh.scale.addScalar(0.7);
                        p.mesh.material.opacity = p.life;
                    } else if (p.type === 'debris') {
                        p.mesh.position.add(p.velocity);
                        p.velocity.y -= p.gravity || 0.4;
                        if (p.mesh.position.y < 0) {
                            p.mesh.position.y = 0;
                            p.velocity.set(0, 0, 0);
                            p.rotVelocity.set(0, 0, 0);
                        }
                        p.mesh.rotation.x += p.rotVelocity.x;
                        p.mesh.rotation.y += p.rotVelocity.y;
                    } else if (p.type === 'segment') {
                        p.mesh.position.add(p.velocity);
                        p.velocity.y -= p.gravity || 0.45;
                        if (p.mesh.position.y < 1.5) {
                            p.mesh.position.y = 1.5;
                            p.velocity.set(0, 0, 0);
                            p.rotVelocity.set(0, 0, 0);
                        }
                        p.mesh.rotation.x += p.rotVelocity.x;
                        p.mesh.rotation.y += p.rotVelocity.y;
                        p.mesh.rotation.z += p.rotVelocity.z;
                    } else if (p.type === 'smoke') {
                        p.mesh.position.add(p.velocity);
                        p.mesh.scale.addScalar(p.scaleGrowth || 0.05);
                        p.mesh.material.opacity = p.life * 0.35;
                    }
                    if (p.life <= 0) {
                        scene.remove(p.mesh);
                        if (p.mesh.geometry) p.mesh.geometry.dispose();
                        if (p.mesh.material) {
                            if (Array.isArray(p.mesh.material)) {
                                p.mesh.material.forEach(m => m.dispose());
                            } else {
                                p.mesh.material.dispose();
                            }
                        }
                        particles.splice(i, 1);
                    }
                }

                // 衝突判定
                if (!isWaitingForFirstTap) {
                    const collisionDistSq = 18 * 18;
                    buildings.forEach(b => {
                        if (!b.destroyed) {
                            const dx = godzillaGroup.position.x - b.x;
                            const dz = godzillaGroup.position.z - b.z;
                            if ((dx * dx + dz * dz) < collisionDistSq) {
                                collapseBuilding(b);
                            }
                        }
                    });
                }

                // 熱線照射処理
                if (isBeamFiring) {
                    beamTimer--;
                    beam.material.opacity = Math.min(1, beam.material.opacity + 0.3);
                    beam.scale.x = 1 + Math.sin(time * 50) * 0.5;
                    beam.scale.z = beam.scale.x;

                    buildings.forEach(b => {
                        if (!b.destroyed) {
                            const forwardDist = (b.x - godzillaGroup.position.x) * Math.sin(godzillaGroup.rotation.y) + (b.z - godzillaGroup.position.z) * Math.cos(godzillaGroup.rotation.y);
                            const lateralDist = Math.abs((b.x - godzillaGroup.position.x) * Math.cos(godzillaGroup.rotation.y) - (b.z - godzillaGroup.position.z) * Math.sin(godzillaGroup.rotation.y));
                            if (forwardDist > 0 && forwardDist < 160 && lateralDist < 14) {
                                collapseBuilding(b);
                            }
                        }
                    });

                    if (beamTimer <= 0) {
                        isBeamFiring = false;
                        spines.forEach(s => s.material.emissive.setHex(0x00c6ff));
                        monsterSpotlight.color.setHex(0x00c6ff);
                        monsterSpotlight.intensity = 14;
                    }
                } else {
                    beam.material.opacity = Math.max(0, beam.material.opacity - 0.15);
                }

                // カメラ制御
                if (isWaitingForFirstTap) {
                    const faceCamDist = 12;
                    const faceCamHeight = 17.5 + Math.sin(time * 2) * 0.3;
                    const faceX = godzillaGroup.position.x + Math.sin(godzillaAngle) * faceCamDist;
                    const faceZ = godzillaGroup.position.z + Math.cos(godzillaAngle) * faceCamDist;

                    camera.position.set(faceX, faceCamHeight, faceZ);
                    camera.lookAt(godzillaGroup.position.x, godzillaGroup.position.y + 17, godzillaGroup.position.z);
                } else if (isIntroAnimating) {
                    introProgress += 0.008;
                    if (introProgress >= 1) {
                        introProgress = 1;
                        isIntroAnimating = false;
                    }

                    const ease = introProgress * introProgress * (3 - 2 * introProgress);

                    const faceCamDist = 12;
                    const faceCamHeight = 17.5;
                    const faceX = godzillaGroup.position.x + Math.sin(godzillaAngle) * faceCamDist;
                    const faceZ = godzillaGroup.position.z + Math.cos(godzillaAngle) * faceCamDist;

                    const playCamDist = 55;
                    const playCamHeight = 18;
                    const rearX = godzillaGroup.position.x - Math.sin(godzillaAngle) * playCamDist;
                    const rearZ = godzillaGroup.position.z - Math.cos(godzillaAngle) * playCamDist;

                    camera.position.x = faceX + (rearX - faceX) * ease;
                    camera.position.y = faceCamHeight + (playCamHeight - faceCamHeight) * ease;
                    camera.position.z = faceZ + (rearZ - faceZ) * ease;

                    const targetHeadY = 17;
                    const targetPlayY = 6;
                    const lookY = targetHeadY + (targetPlayY - targetHeadY) * ease;
                    camera.lookAt(godzillaGroup.position.x, godzillaGroup.position.y + lookY, godzillaGroup.position.z);
                } else {
                    const camDist = 55;
                    const camHeight = 18;
                    const targetX = godzillaGroup.position.x - Math.sin(godzillaAngle) * camDist;
                    const targetZ = godzillaGroup.position.z - Math.cos(godzillaAngle) * camDist;

                    camera.position.x += (targetX - camera.position.x) * 0.1;
                    camera.position.y += (camHeight - camera.position.y) * 0.1;
                    camera.position.z += (targetZ - camera.position.z) * 0.1;

                    camera.lookAt(godzillaGroup.position.x, godzillaGroup.position.y + 6, godzillaGroup.position.z);
                }

                renderer.render(scene, camera);
            }

            function handleResize() {
                const size = getViewportSize();
                camera.aspect = size.width / size.height;
                camera.updateProjectionMatrix();
                renderer.setSize(size.width, size.height);
            }

            window.addEventListener('resize', handleResize);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', handleResize);
                window.visualViewport.addEventListener('scroll', handleResize);
            }

            window.onload = () => {
                const btnBeam = document.getElementById('btnBeam');
                if (btnBeam) {
                    btnBeam.addEventListener('click', () => { triggerActionInteraction(); triggerBeam(); });
                    btnBeam.addEventListener('touchstart', (e) => { e.preventDefault(); triggerActionInteraction(); triggerBeam(); });
                }

                const btnRoar = document.getElementById('btnRoar');
                if (btnRoar) {
                    const doRoar = (e) => {
                        e.preventDefault();
                        triggerActionInteraction();
                        playRoarSound();
                    };
                    btnRoar.addEventListener('click', doRoar);
                    btnRoar.addEventListener('touchstart', doRoar);
                }

                window.addEventListener('pointerdown', () => {
                    triggerActionInteraction();
                });

                const bindButton = (id, keyName) => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    ['mousedown', 'touchstart'].forEach(evt => {
                        el.addEventListener(evt, (e) => { e.preventDefault(); triggerActionInteraction(); keys[keyName] = true; });
                    });
                    ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(evt => {
                        el.addEventListener(evt, (e) => { e.preventDefault(); keys[keyName] = false; });
                    });
                };

                bindButton('btnUp', 'w');
                bindButton('btnDown', 's');
                bindButton('btnLeft', 'a');
                bindButton('btnRight', 'd');

                const btnGuideToggle = document.getElementById('btnGuideToggle');
                const guideModal = document.getElementById('guideModal');
                const btnCloseGuide = document.getElementById('btnCloseGuide');

                if (btnGuideToggle && guideModal) {
                    btnGuideToggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        triggerActionInteraction();
                        guideModal.classList.toggle('hidden');
                    });
                }
                if (btnCloseGuide && guideModal) {
                    btnCloseGuide.addEventListener('click', () => {
                        guideModal.classList.add('hidden');
                    });
                }

                const btnReset = document.getElementById('btnReset');
                if (btnReset) {
                    btnReset.addEventListener('click', resetGame);
                }

                const btnClearRestart = document.getElementById('btnClearRestart');
                if (btnClearRestart) {
                    btnClearRestart.addEventListener('click', resetGame);
                }

                startIntroCamera();
                setTimeout(() => {
                    playRoarSound();
                }, 400);

                animate();
            };
        }
    </script>
</body>
</html>
