<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>うんこちんこアプリ</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #121212;
            color: #ff5555;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #1e1e1e;
            border: 2px solid #ff5555;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(255, 85, 85, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
        }
        button {
            background: #ff5555;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        "utton:hover {
            background: #ff2222;
            box-shadow: 0 0 10px #ff5555;
        }
        #counter {
            font-size: 20px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>💩 うんこちんこアプリ チンポ</h1>
        <p>最高にしょうもないアプリだよ！</p>
        <button id="clickBtn">クリック</button>
        <div id="counter">連打数: 0</div>
    </div>

    <script>
        let count = 0;
        const btn = document.getElementById('clickBtn');
        const counter = document.getElementById('counter');

        btn.addEventListener('click', () => {
            count++;
            counter.textContent = `連打数: ${count}`;
        });
    </script>
</body>
</html>
