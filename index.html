<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCHA NORMA 窪田七海 特集 🦎✨</title>
    <style>
        :root {
            --primary-color: #ff69b4;
            --bg-color: #0f0f13;
            --card-bg: #1a1a24;
            --text-color: #f0f0f0;
            --accent-color: #00ffcc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 105, 180, 0.2);
            margin-bottom: 20px;
        }
        .header {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .header p {
            margin: 10px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .content {
            padding: 25px;
        }
        .profile-card {
            display: flex;
            font-direction: column;
            align-items: center;
            text-align: center;
        }
        .profile-img-container {
            width: 100%;
            max-height: 350px;
            overflow: hidden;
            border-radius: 12px;
            margin-bottom: 20px;
            background: #2a2a38;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-img-container img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }
        .bio {
            text-align: left;
            width: 100%;
            line-height: 1.6;
            font-size: 15px;
            color: #ddd;
        }
        .bio h2 {
            font-size: 18px;
            color: var(--primary-color);
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            margin-top: 0;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }
        .tag {
            background: rgba(255, 105, 180, 0.15);
            color: var(--primary-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid rgba(255, 105, 180, 0.3);
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🌸 窪田七海 (OCHA NORMA) 🌸</h1>
            <p>キュルルンッ💓 世界一可愛いアイドル特集中！</p>
        </div>
        <div class="content">
            <div class="profile-card">
                <div class="profile-img-container">
                    <!-- 信頼性の高い公式ハロー！プロジェクトのプロフィール画像を使用 -->
                    <img src="https://www.helloproject.com/ochanorma/images/pic_nanami_kubota.jpg" alt="窪田七海">
                </div>
                <div class="bio">
                    <h2>Profile</h2>
                    <p><strong>ニックネーム：</strong>キュルルン</p>
                    <p><strong>生年月日：</strong>2004年7月23日</p>
                    <p><strong>出身地：</strong>千葉県</p>
                    <p><strong>メンバーカラー：</strong>ピンク</p>
                    <p><strong>特技：</strong>アクロバット、メロメロにできるビーム出せます🪄</p>
                    <p><strong>趣味：</strong>少女漫画を読むこと、辛いラーメンを食べる事</p>
                    
                    <div class="tags">
                        <span class="tag">#OCHA_NORMA</span>
                        <span class="tag">#ハロプロ</span>
                        <span class="tag">#キュルルンななみん</span>
                        <span class="tag">#ピンク</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        Created for Master 🦎✨ | Powered by Netlify & GitHub
    </div>

</body>
</html>
