<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ライオンVSひよこ＆邪魔女あみー</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #111;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  #game-container {
    position: relative;
    width: 100vw;
    height: 95vh;
    max-width: 500px;
    max-height: 95vh;
    margin: 2.5vh auto;
    background: linear-gradient(to bottom, #70e1f5 0%, #ffd194 100%);
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  
  /* UI Header Overlay */
  #ui-layer {
    position: absolute;
    top: 36px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }
  .ui-box {
    font-weight: 900;
    font-size: 25px;
    color: #ffffff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8), 0 0 6px rgba(0,0,0,0.5);
    letter-spacing: 1px;
  }
  #warning-banner {
    position: absolute;
    top: 82px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 50, 50, 0.9);
    color: white;
    padding: 6px 18px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    z-index: 9;
    box-shadow: 0 2px 8px rgba(255,0,0,0.4);
  }

  /* Controls */
  #controls {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    height: 90px;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
    z-index: 10;
  }
  .btn-group {
    display: flex;
    gap: 12px;
    pointer-events: auto;
  }
  .btn {
    width: 68px;
    height: 68px;
    background: rgba(255, 255, 255, 0.85);
    border: 3px solid #333;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 26px;
    font-weight: bold;
    color: #222;
    box-shadow: 0 6px 12px rgba(0,0,0,0.25);
    touch-action: manipulation;
    cursor: pointer;
    transition: background 0.1s, transform 0.1s;
  }
  .btn:active, .btn.active {
    background: #FFD700;
    transform: scale(0.92);
  }

  /* Game Modal Screens */
  .screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 15, 25, 0.85);
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    z-index: 20;
    text-align: center;
    padding: 25px;
  }
  .screen h1 {
    font-size: 32px;
    margin-bottom: 15px;
    color: #FFD700;
    text-shadow: 0 2px 10px rgba(255,215,0,0.5);
    line-height: 1.3;
  }
  .screen p {
    font-size: 16px;
    margin-bottom: 25px;
    line-height: 1.7;
    color: #eee;
    background: rgba(255,255,255,0.1);
    padding: 15px;
    border-radius: 12px;
  }
  .start-btn {
    padding: 14px 40px;
    font-size: 18px;
    font-weight: bold;
    background: linear-gradient(135deg, #FF4500, #FF8C00);
    color: white;
    border: none;
    border-radius: 30px;
    box-shadow: 0 6px 15px rgba(255, 69, 0, 0.4);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 69, 0, 0.6);
  }
  .start-btn:active {
    transform: scale(0.95);
  }

  .rule-highlight {
    color: #FF6B6B;
    font-weight: bold;
  }
  .safe-highlight {
    color: #4EADDD;
    font-weight: bold;
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="ui-layer">
    <div class="ui-box" id="score-display">SCORE: 0</div>
    <div class="ui-box" id="life-display">LIFE: ❤️❤️❤️</div>
  </div>

  <div id="warning-banner">⚠️ あみーが接近中！</div>

  <canvas id="gameCanvas"></canvas>

  <div id="controls">
    <div class="btn-group">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
    <div class="btn-group">
      <div class="btn" id="btn-jump">▲</div>
    </div>
  </div>

  <div id="start-screen" class="screen">
    <h1>ライオン VS ひよこ<br>＆ 邪魔女あみー</h1>
    <p>
      【操作】左右ボタンで移動、▲でジャンプ！<br><br>
      🐥 <b>ひよこ達</b>：<span class="safe-highlight">「上半身」</span>で捕まえて得点GET！（下半身はすり抜けます）<br>
      👩 <b>邪魔女あみー</b>：画面外から急襲！<br>
      🚨 ライオンの<span class="rule-highlight">「下半身」</span>を触られるとライフ減少！<br>
      🛡️ <span class="safe-highlight">「上半身」</span>は触られてもセーフ！<br>
      ⏱️ 時間経過であみーの移動速度がどんどんアップ！
    </p>
    <button class="start-btn" onclick="startGame()">ゲームスタート</button>
  </div>

  <div id="gameover-screen" class="screen" style="display: none;">
    <h1 style="color: #FF4500;">GAME OVER</h1>
    <p id="final-score" style="font-size: 20px; font-weight: bold; color: #FFD700;">SCORE: 0</p>
    <button class="start-btn" onclick="startGame()">もう一度遊ぶ</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');
const warningBanner = document.getElementById('warning-banner');

// ★ デバッグ用フラグ（ヒットボックス非表示）
const DEBUG_HITBOX = false;

// 🔊 Web Audio API による自前効果音ジェネレーター
class SoundEffects {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // ジャンプ音（ポップな上昇音）
  playJump() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(420, now + 0.12);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  }

  // ひよこゲット音（ピロリン♪キラキラ高音）
  playCollect() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, now);        // ド (C5)
    osc.frequency.setValueAtTime(659.25, now + 0.05); // ミ (E5)
    osc.frequency.setValueAtTime(783.99, now + 0.10); // ソ (G5)
    osc.frequency.setValueAtTime(1046.50, now + 0.15);// ド (C6)
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.28);
  }

  // あみーダメージ音（ドカン！ノイズ混じり衝撃音）
  playDamage() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.linearRampToValueAtTime(40, now + 0.22);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.22);
  }

  // あみー接近警告音（ピピッとアラーモ）
  playWarning() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.setValueAtTime(440, now + 0.07);
    osc.frequency.setValueAtTime(880, now + 0.14);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.22);
  }

  // ゲームオーバー音
  playGameOver() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.linearRampToValueAtTime(80, now + 0.6);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.6);
  }

  // ボタンクリック音
  playClick() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(500, now);
    osc.frequency.exponentialRampToValueAtTime(250, now + 0.05);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.05);
  }
}

const sfx = new SoundEffects();

function resizeCanvas() {
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Image loading helper with Fallback shapes
function createFallbackImage(color, text) {
  const c = document.createElement('canvas');
  c.width = 120; c.height = 120;
  const cx = c.getContext('2d');
  cx.fillStyle = color;
  cx.fillRect(0, 0, 120, 120);
  cx.fillStyle = '#fff';
  cx.font = 'bold 16px sans-serif';
  cx.textAlign = 'center';
  cx.fillText(text, 60, 65);
  const img = new Image();
  img.src = c.toDataURL();
  return img;
}

const imgLion = new Image();
imgLion.crossOrigin = "anonymous";
imgLion.src = 'https://lh3.googleusercontent.com/d/1y3EtB_JJinN96GWDGo-wsxcYW5I_RMg4';

const imgHiyoko = new Image();
imgHiyoko.crossOrigin = "anonymous";
imgHiyoko.src = 'https://lh3.googleusercontent.com/d/1RRfI2OphJVOCqbZ6W7TkJdurwSw1dbum';

const imgAmee = new Image();
imgAmee.crossOrigin = "anonymous";
imgAmee.src = 'https://lh3.googleusercontent.com/d/1MvBTz8SXtYoBhtLbCRjaXUZNl2XBipv5';

// Fallback handlers if Google Drive images fail to load
let lionFallback = false, hiyokoFallback = false, ameeFallback = false;
imgLion.onerror = () => { lionFallback = true; };
imgHiyoko.onerror = () => { hiyokoFallback = true; };
imgAmee.onerror = () => { ameeFallback = true; };

// Game State
let gameState = 'START';
let score = 0;
let lives = 3;
let gameTime = 0;
let animationFrameId;

const keys = { left: false, right: false, jump: false };

// Bind Control Buttons
const bindBtn = (id, key) => {
  const el = document.getElementById(id);
  const start = (e) => { 
    e.preventDefault(); 
    sfx.init();
    keys[key] = true; 
    el.classList.add('active'); 
  };
  const end = (e) => { e.preventDefault(); keys[key] = false; el.classList.remove('active'); };
  el.addEventListener('touchstart', start);
  el.addEventListener('touchend', end);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
};
bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-jump', 'jump');

window.addEventListener('keydown', e => {
  sfx.init();
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = false;
});

// Lion Object (Splits into upper and lower body)
const lion = {
  x: 100, y: 300,
  vx: 0, vy: 0,
  width: 120, height: 108, // ★ 120%に拡大 (元: 100x90)
  facingRight: true,
  isGrounded: false,
  jointAngle: 0,
  
  update() {
    if (keys.left) {
      this.vx = -5.4; // スケールに合わせて移動速度を調整
      this.facingRight = false;
    } else if (keys.right) {
      this.vx = 5.4;
      this.facingRight = true;
    } else {
      this.vx *= 0.75;
    }

    if (keys.jump && this.isGrounded) {
      this.vy = -14.8; // キャラ拡大に合わせてジャンプ高度を1.2倍に補正
      this.isGrounded = false;
      sfx.playJump(); // ★ ジャンプ効果音
    }

    this.vy += 0.55; // Gravity
    this.x += this.vx;
    this.y += this.vy;

    if (this.x < 0) this.x = 0;
    if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

    const floorY = canvas.height - 80;
    if (this.y + this.height >= floorY) {
      this.y = floorY - this.height;
      this.vy = 0;
      this.isGrounded = true;
    }

    if (Math.abs(this.vx) > 0.5 || !this.isGrounded) {
      this.jointAngle += 0.2;
    } else {
      this.jointAngle *= 0.8;
    }
  },

  draw() {
    ctx.save();
    
    // Joint articulation math
    const bounceY = Math.sin(this.jointAngle) * 3;
    const bodyBend = Math.cos(this.jointAngle) * 0.1;

    ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
    if (this.facingRight) ctx.scale(-1, 1);

    const w = this.width;
    const h = this.height;

    if (lionFallback || !imgLion.complete || imgLion.naturalWidth === 0) {
      // Fallback procedural lion
      // Upper body
      ctx.fillStyle = '#FFA500';
      ctx.fillRect(-w/2, -h/2, w/2, h);
      ctx.fillStyle = '#8B4513';
      ctx.fillRect(-w/2 - 10, -h/2 - 10, 30, h + 20); // Mane
      
      // Lower body
      ctx.fillStyle = '#FF8C00';
      ctx.fillRect(0, -h/2 + 10 + bounceY, w/2, h - 10);
    } else {
      const srcW = imgLion.width;
      const srcH = imgLion.height;

      // 1. Lower Body (Right half of lion image: Back/Tail)
      ctx.save();
      ctx.translate(0, bounceY);
      ctx.rotate(bodyBend);
      ctx.drawImage(
        imgLion,
        srcW / 2, 0, srcW / 2, srcH,
        0, -h / 2, w / 2, h
      );
      ctx.restore();

      // 2. Upper Body (Left half of lion image: Head/Chest)
      ctx.save();
      ctx.rotate(-bodyBend * 0.5);
      ctx.drawImage(
        imgLion,
        0, 0, srcW / 2, srcH,
        -w / 2, -h / 2, w / 2, h
      );
      ctx.restore();
    }

    ctx.restore();
  },

  // Separate hitboxes for Upper and Lower body
  getHitboxes() {
    const halfWidth = this.width / 2;
    // 下半身の判定を少し小さくして上半身との境目に余裕を持たせる (120%サイズに比例調整)
    if (this.facingRight) {
      return {
        upper: { x: this.x, y: this.y, width: halfWidth, height: this.height },
        lower: { x: this.x + halfWidth + 10, y: this.y + 30, width: halfWidth - 14, height: this.height - 36 }
      };
    } else {
      return {
        upper: { x: this.x + halfWidth, y: this.y, width: halfWidth, height: this.height },
        lower: { x: this.x + 5, y: this.y + 30, width: halfWidth - 14, height: this.height - 36 }
      };
    }
  }
};

// Hiyoko Class (Daphnia/Water-flea floating physics)
class Hiyoko {
  constructor(index) {
    this.index = index; // 0, 1, 2 for 3-split image
    this.reset();
  }

  reset() {
    this.width = 50;  // ★ 120%に拡大 (元: 42)
    this.height = 50; // ★ 120%に拡大 (元: 42)
    this.x = Math.random() * (canvas.width - this.width);
    this.y = Math.random() * (canvas.height * 0.4) + 40;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = 0;
    this.gravity = 0.15; // 重力を強めて下へ自然に沈むように調整
    this.jumpTimer = 0;
    this.nextJumpTime = Math.floor(30 + Math.random() * 90); // ランダムなジャンプ間隔
    this.pulseScale = 1;
  }

  update() {
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;

    // Pulse Jump Motion with random interval and force variation
    this.jumpTimer++;
    if (this.jumpTimer > this.nextJumpTime) {
      // 弱めのキックとたまに出る強めのジャンプでムラを演出
      const isSmallHop = Math.random() < 0.4;
      this.vy = isSmallHop ? (-2.5 - Math.random() * 1.5) : (-4.5 - Math.random() * 2.0);
      this.vx += (Math.random() - 0.5) * 2.5;
      this.jumpTimer = 0;
      
      // 次のジャンプまでの時間を不規則に（たまに連打、たまに放置して沈む）
      const burstJump = Math.random() < 0.25;
      this.nextJumpTime = burstJump ? Math.floor(12 + Math.random() * 15) : Math.floor(50 + Math.random() * 110);
      this.pulseScale = 1.25;
    }

    this.pulseScale += (1 - this.pulseScale) * 0.1;

    // Boundaries
    if (this.x < 10) { this.x = 10; this.vx *= -1; }
    if (this.x + this.width > canvas.width - 10) { this.x = canvas.width - 10 - this.width; this.vx *= -1; }
    
    // Screen top boundary bounce
    if (this.y < 30) {
      this.y = 30;
      this.vy = 1.2;
    }
    
    // Bottom floor rebound
    const floorY = canvas.height - 90;
    if (this.y + this.height > floorY) {
      this.y = floorY - this.height;
      this.vy = -3.5 - Math.random() * 2.0;
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x + this.width/2, this.y + this.height/2);
    ctx.scale(this.pulseScale, this.pulseScale);

    if (hiyokoFallback || !imgHiyoko.complete || imgHiyoko.naturalWidth === 0) {
      // Fallback chick
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(0, 0, this.width/2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FF4500';
      ctx.fillRect(4, -2, 6, 4);
    } else {
      const srcW = imgHiyoko.width / 3;
      const srcH = imgHiyoko.height;
      const srcX = this.index * srcW;

      ctx.drawImage(
        imgHiyoko,
        srcX, 0, srcW, srcH,
        -this.width/2, -this.height/2, this.width, this.height
      );
    }
    ctx.restore();
  }
}

// Amee Object (Obstacle Girl)
const amee = {
  x: -120, y: 0,
  width: 72, height: 132, // ★ 120%に拡大 (元: 60x110)
  baseSpeed: 2.8,
  speed: 2.8,
  active: false,
  timer: 0,
  direction: 1,

  spawn() {
    this.active = true;
    this.direction = Math.random() < 0.5 ? 1 : -1;
    
    if (this.direction === 1) {
      this.x = -this.width - 20;
    } else {
      this.x = canvas.width + 20;
    }
    
    // Runs along ground
    this.y = canvas.height - 80 - this.height;
    
    // Calculate speed based on game time
    const speedBoost = Math.min(gameTime * 0.002, 5.0);
    this.speed = (this.baseSpeed + speedBoost) * this.direction;

    sfx.playWarning(); // ★ あみー出現警告音
    warningBanner.style.opacity = '1';
    setTimeout(() => { warningBanner.style.opacity = '0'; }, 1200);
  },

  update() {
    if (!this.active) {
      this.timer++;
      const spawnInterval = Math.max(50, 180 - Math.floor(gameTime / 45));
      if (this.timer > spawnInterval) {
        this.spawn();
        this.timer = 0;
      }
      return;
    }

    this.x += this.speed;

    // Out of bounds reset
    if ((this.direction === 1 && this.x > canvas.width + 60) || 
        (this.direction === -1 && this.x < -this.width - 60)) {
      this.active = false;
      this.timer = 0;
    }
  },

  draw() {
    if (!this.active) return;
    ctx.save();
    
    if (this.direction === -1) {
      ctx.translate(this.x + this.width, this.y);
      ctx.scale(-1, 1);
      this.drawBody(0, 0);
    } else {
      this.drawBody(this.x, this.y);
    }

    ctx.restore();
  },

  drawBody(px, py) {
    if (ameeFallback || !imgAmee.complete || imgAmee.naturalWidth === 0) {
      // Fallback Amee
      ctx.fillStyle = '#FF1493';
      ctx.fillRect(px, py, this.width, this.height);
      ctx.fillStyle = '#FFC0CB';
      ctx.beginPath();
      ctx.arc(px + this.width/2, py + 20, 15, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.drawImage(imgAmee, px, py, this.width, this.height);
    }
  },

  // あみー自身の判定も120%サイズに合わせてスケール補正
  getHitbox() {
    return {
      x: this.x + 10,
      y: this.y + 12,
      width: this.width - 20,
      height: this.height - 18
    };
  }
};

const hiyokos = [new Hiyoko(0), new Hiyoko(1), new Hiyoko(2)];

function isColliding(rect1, rect2) {
  return rect1.x < rect2.x + rect2.width &&
         rect1.x + rect1.width > rect2.x &&
         rect1.y < rect2.y + rect2.height &&
         rect1.y + rect1.height > rect2.y;
}

let invincibleTimer = 0;

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background Environment
  ctx.fillStyle = '#5A9E32';
  ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
  ctx.fillStyle = '#73C83C';
  ctx.fillRect(0, canvas.height - 85, canvas.width, 10);

  if (gameState === 'PLAYING') {
    gameTime++;

    lion.update();
    hiyokos.forEach(h => h.update());
    amee.update();

    if (invincibleTimer > 0) invincibleTimer--;

    const hitboxes = lion.getHitboxes();

    // Collision: Lion vs Hiyoko (UPPER BODY ONLY)
    hiyokos.forEach(h => {
      if (isColliding(hitboxes.upper, h)) {
        score += 100;
        sfx.playCollect(); // ★ ひよこゲット音
        document.getElementById('score-display').innerText = `SCORE: ${score}`;
        h.reset();
      }
    });

    // Collision: Amee vs Lion (LOWER BODY ONLY)
    if (amee.active && invincibleTimer === 0) {
      // あみーの絞ったヒットボックスと、ライオンの下半身のみで判定！
      if (isColliding(amee.getHitbox(), hitboxes.lower)) {
        lives--;
        sfx.playDamage(); // ★ 被ダメージ音
        invincibleTimer = 60; // 1 sec invincibility
        updateLifeDisplay();

        if (lives <= 0) {
          gameState = 'GAMEOVER';
          sfx.playGameOver(); // ★ ゲームオーバー音
          document.getElementById('final-score').innerText = `FINAL SCORE: ${score}`;
          document.getElementById('gameover-screen').style.display = 'flex';
        }
      }
    }
  }

  // Render Entities
  hiyokos.forEach(h => h.draw());
  amee.draw();
  
  if (invincibleTimer % 6 < 3) {
    lion.draw();
  }

  // デバッグ用ヒットボックス描画 (DEBUG_HITBOX = true のときのみ実行)
  if (DEBUG_HITBOX) {
    ctx.save();
    ctx.lineWidth = 2;

    const hitboxes = lion.getHitboxes();

    // 1. ライオン上半身（青: ひよこ獲得判定）
    ctx.fillStyle = 'rgba(0, 150, 255, 0.35)';
    ctx.strokeStyle = '#0088ff';
    ctx.fillRect(hitboxes.upper.x, hitboxes.upper.y, hitboxes.upper.width, hitboxes.upper.height);
    ctx.strokeRect(hitboxes.upper.x, hitboxes.upper.y, hitboxes.upper.width, hitboxes.upper.height);

    // 2. ライオン下半身（赤: ダメージ判定）
    ctx.fillStyle = 'rgba(255, 0, 0, 0.35)';
    ctx.strokeStyle = '#ff0000';
    ctx.fillRect(hitboxes.lower.x, hitboxes.lower.y, hitboxes.lower.width, hitboxes.lower.height);
    ctx.strokeRect(hitboxes.lower.x, hitboxes.lower.y, hitboxes.lower.width, hitboxes.lower.height);

    // 3. ひよこ（黄: 対象オブジェクト）
    ctx.fillStyle = 'rgba(255, 230, 0, 0.35)';
    ctx.strokeStyle = '#ffd700';
    hiyokos.forEach(h => {
      ctx.fillRect(h.x, h.y, h.width, h.height);
      ctx.strokeRect(h.x, h.y, h.width, h.height);
    });

    // 4. あみー（紫: 障害物判定）
    if (amee.active) {
      const ameeHb = amee.getHitbox();
      ctx.fillStyle = 'rgba(255, 0, 255, 0.35)';
      ctx.strokeStyle = '#ff00ff';
      ctx.fillRect(ameeHb.x, ameeHb.y, ameeHb.width, ameeHb.height);
      ctx.strokeRect(ameeHb.x, ameeHb.y, ameeHb.width, ameeHb.height);
    }

    ctx.restore();
  }

  animationFrameId = requestAnimationFrame(gameLoop);
}

function updateLifeDisplay() {
  let hearts = '';
  for (let i = 0; i < lives; i++) hearts += '❤️';
  document.getElementById('life-display').innerText = `LIFE: ${hearts}`;
}

function startGame() {
  sfx.init();
  sfx.playClick(); // ★ ボタン押下音

  score = 0;
  lives = 3;
  gameTime = 0;
  invincibleTimer = 0;
  amee.active = false;
  amee.timer = 0;

  lion.x = canvas.width / 2 - 50;
  lion.y = canvas.height - 180;
  lion.vx = 0;
  lion.vy = 0;

  hiyokos.forEach(h => h.reset());

  document.getElementById('score-display').innerText = `SCORE: 0`;
  updateLifeDisplay();

  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('gameover-screen').style.display = 'none';

  gameState = 'PLAYING';
}

// Start Game Loop
gameLoop();
</script>
